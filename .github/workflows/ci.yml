name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python monitorctl.py --config config/monitoring.yml render
      - run: python tools/integrate_dashboards.py --overview monitoring/grafana/dashboards/inference-overview.json --detail monitoring/grafana/fragments/sglang-detailed.fragment.json --output /tmp/inference-overview.json
      - run: python -m py_compile monitorctl.py tools/*.py exporters/*.py
